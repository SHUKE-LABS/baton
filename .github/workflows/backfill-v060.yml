name: backfill-v060

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (e.g. v0.6.0)
        required: true
        default: v0.6.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        run: cargo build --locked --release --target "${TARGET}"

      - name: Verify binary version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          binary="target/${TARGET}/release/baton"
          if [[ "${TARGET}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          test "$("./${binary}" --version)" = "baton ${version}"

      - name: Archive Unix binary
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="baton-${version}-${TARGET}.tar.gz"
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          cp "target/${TARGET}/release/baton" "${staging}/baton"
          tar -C "${staging}" -czf "${archive}" baton

      - name: Archive Windows binary
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "baton-$version-$($env:TARGET).zip"
          $staging = Join-Path $env:RUNNER_TEMP "baton-archive-$($env:TARGET)"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/$($env:TARGET)/release/baton.exe" (Join-Path $staging "baton.exe")
          Compress-Archive -LiteralPath (Join-Path $staging "baton.exe") -DestinationPath $archive -Force

      - name: Upload target archive
        uses: actions/upload-artifact@v6
        with:
          name: baton-${{ matrix.target }}
          path: baton-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-notes
          bash scripts/release.sh generate-release-notes "${RELEASE_TAG}" > release-notes/release-notes.md

      - name: Download target archives
        uses: actions/download-artifact@v7
        with:
          pattern: baton-*
          path: dist
          merge-multiple: true

      - name: Validate archives and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "baton-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "baton-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "baton-${version}-x86_64-apple-darwin.tar.gz"
            "baton-${version}-aarch64-apple-darwin.tar.gz"
            "baton-${version}-x86_64-pc-windows-msvc.zip"
          )

          for asset in "${assets[@]}"; do
            test -f "dist/${asset}"
            case "${asset}" in
              *.tar.gz)
                test "$(tar -tzf "dist/${asset}")" = "baton"
                ;;
              *.zip)
                test "$(unzip -Z1 "dist/${asset}")" = "baton.exe"
                ;;
            esac
          done

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
          (
            cd dist
            sha256sum "${assets[@]}"
          ) > SHA256SUMS
          (
            cd dist
            sha256sum --check ../SHA256SUMS
          )

      - name: Stage npm packages and preflight publish
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash scripts/release.sh stage-npm-packages "${version}" dist npm-packages

          package_dirs=(
            baton-linux-x64
            baton-linux-arm64
            baton-darwin-x64
            baton-darwin-arm64
            baton-win32-x64
            baton
          )
          mkdir -p npm-tarballs
          pack_destination="${PWD}/npm-tarballs"
          for package_dir in "${package_dirs[@]}"; do
            (
              cd "npm-packages/${package_dir}"
              npm pack --ignore-scripts --pack-destination "${pack_destination}" >/dev/null
            )
          done

          bash scripts/release.sh verify-npm-packages "${version}" npm-packages
          bash scripts/release.sh npm-checksums npm-tarballs npm-SHA256SUMS
          npm_tarballs=(
            "shukelabs-baton-linux-x64-${version}.tgz"
            "shukelabs-baton-linux-arm64-${version}.tgz"
            "shukelabs-baton-darwin-x64-${version}.tgz"
            "shukelabs-baton-darwin-arm64-${version}.tgz"
            "shukelabs-baton-win32-x64-${version}.tgz"
            "shukelabs-baton-${version}.tgz"
          )
          test "$(find npm-tarballs -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq "${#npm_tarballs[@]}"
          for tarball in "${npm_tarballs[@]}"; do
            test -f "npm-tarballs/${tarball}"
          done
          (
            cd npm-tarballs
            sha256sum --check ../npm-SHA256SUMS
          )

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          npm_packages=(
            "@shukelabs/baton-linux-x64"
            "@shukelabs/baton-linux-arm64"
            "@shukelabs/baton-darwin-x64"
            "@shukelabs/baton-darwin-arm64"
            "@shukelabs/baton-win32-x64"
            "@shukelabs/baton"
          )
          npm_tarballs=(
            "shukelabs-baton-linux-x64-${version}.tgz"
            "shukelabs-baton-linux-arm64-${version}.tgz"
            "shukelabs-baton-darwin-x64-${version}.tgz"
            "shukelabs-baton-darwin-arm64-${version}.tgz"
            "shukelabs-baton-win32-x64-${version}.tgz"
            "shukelabs-baton-${version}.tgz"
          )
          test -n "${NODE_AUTH_TOKEN:-}" || {
            echo '::error::NPM_TOKEN release secret is required to publish npm packages'
            exit 1
          }

          # A backfill may be re-dispatched after a partial failure, so each
          # package is checked against the registry first: a confirmed E404
          # ("not published yet") is the only case that proceeds to publish.
          # Any other npm-view outcome (auth, network, registry error) fails
          # closed instead of guessing whether it is safe to publish.
          npm_package_already_published() {
            local spec="$1" output
            if output="$(npm view "${spec}" version 2>&1)"; then
              return 0
            fi
            if grep -q 'code E404' <<<"${output}"; then
              return 1
            fi
            echo "::error::could not determine npm publish status for ${spec}" >&2
            printf '%s\n' "${output}" >&2
            exit 1
          }

          published=()
          skipped=()
          for i in "${!npm_tarballs[@]}"; do
            tarball="${npm_tarballs[${i}]}"
            package="${npm_packages[${i}]}@${version}"
            if npm_package_already_published "${package}"; then
              skipped+=("${package}")
              continue
            fi
            if npm publish --access public --ignore-scripts "./npm-tarballs/${tarball}"; then
              published+=("${tarball}")
            else
              echo "::error::npm publish failed after ${#published[@]} of ${#npm_tarballs[@]} packages"
              printf 'published before failure: %s\n' "${published[*]:-none}"
              exit 1
            fi
          done
          printf 'published: %s\n' "${published[*]:-none}"
          printf 'already on the registry (skipped): %s\n' "${skipped[*]:-none}"

      - name: Stage and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "baton-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "baton-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "baton-${version}-x86_64-apple-darwin.tar.gz"
            "baton-${version}-aarch64-apple-darwin.tar.gz"
            "baton-${version}-x86_64-pc-windows-msvc.zip"
          )
          upload_paths=(SHA256SUMS npm-SHA256SUMS)
          for asset in "${assets[@]}"; do
            upload_paths+=("dist/${asset}")
          done

          # Fail closed if a release for this tag already exists rather than
          # guessing whether it is safe to recreate it: a confirmed
          # "release not found" is the only case that proceeds.
          release_view_output="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" 2>&1)" && {
            echo "::error::release ${RELEASE_TAG} already exists; refusing to recreate it"
            exit 1
          }
          if ! grep -qi 'release not found' <<<"${release_view_output}"; then
            echo "::error::could not determine release status for ${RELEASE_TAG}" >&2
            printf '%s\n' "${release_view_output}" >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Baton ${RELEASE_TAG}" \
            --notes-file release-notes/release-notes.md \
            "${upload_paths[@]}"
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
