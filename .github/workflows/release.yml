name: release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and apply release version
        id: release
        shell: bash
        run: |
          tag="$(bash scripts/release.sh create-tag)"
          version="${tag#v}"
          manifest_version="$(bash scripts/release.sh manifest-version)"
          lockfile_version="$(bash scripts/release.sh lockfile-version)"
          test "${manifest_version}" = "${version}"
          test "${lockfile_version}" = "${version}"
          bash scripts/release.sh verify-docs
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      # The changelog is its own commit layered on the tagged release commit,
      # so its parent carries the tag and the single push below ships both.
      # [skip ci] keeps that push from re-triggering this workflow and keeps the
      # commit out of the next release's entries.
      - name: Regenerate changelog and release notes
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          bash scripts/release.sh generate-changelog CHANGELOG.md
          bash scripts/release.sh generate-release-notes "${tag}" > release-notes.md
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "docs: regenerate changelog [skip ci]" >/dev/null
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - name: Push release commit and tag
        run: git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${{ steps.release.outputs.tag }}"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        # The glibc of the linux runner becomes the binary's minimum glibc.
        # ubuntu-latest (24.04, glibc 2.39) produced binaries that refuse to
        # start on Debian 12 (glibc 2.36). Pin 22.04 (glibc 2.35) so the
        # released binaries run on Debian 12, Ubuntu 22.04+ and RHEL 9.
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        run: cargo build --locked --release --target "${TARGET}"

      - name: Verify binary version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          binary="target/${TARGET}/release/baton"
          if [[ "${TARGET}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          test "$("./${binary}" --version)" = "baton ${version}"

      - name: Archive Unix binary
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="baton-${version}-${TARGET}.tar.gz"
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          cp "target/${TARGET}/release/baton" "${staging}/baton"
          tar -C "${staging}" -czf "${archive}" baton

      - name: Archive Windows binary
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "baton-$version-$($env:TARGET).zip"
          $staging = Join-Path $env:RUNNER_TEMP "baton-archive-$($env:TARGET)"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/$($env:TARGET)/release/baton.exe" (Join-Path $staging "baton.exe")
          Compress-Archive -LiteralPath (Join-Path $staging "baton.exe") -DestinationPath $archive -Force

      - name: Upload target archive
        uses: actions/upload-artifact@v6
        with:
          name: baton-${{ matrix.target }}
          path: baton-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes

      - name: Download target archives
        uses: actions/download-artifact@v7
        with:
          pattern: baton-*
          path: dist
          merge-multiple: true

      - name: Validate archives and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "baton-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "baton-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "baton-${version}-x86_64-apple-darwin.tar.gz"
            "baton-${version}-aarch64-apple-darwin.tar.gz"
            "baton-${version}-x86_64-pc-windows-msvc.zip"
          )

          for asset in "${assets[@]}"; do
            test -f "dist/${asset}"
            case "${asset}" in
              *.tar.gz)
                test "$(tar -tzf "dist/${asset}")" = "baton"
                ;;
              *.zip)
                test "$(unzip -Z1 "dist/${asset}")" = "baton.exe"
                ;;
            esac
          done

          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
          (
            cd dist
            sha256sum "${assets[@]}"
          ) > SHA256SUMS
          (
            cd dist
            sha256sum --check ../SHA256SUMS
          )

      - name: Stage npm packages and preflight publish
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bash scripts/release.sh stage-npm-packages "${version}" dist npm-packages

          package_dirs=(
            baton-linux-x64
            baton-linux-arm64
            baton-darwin-x64
            baton-darwin-arm64
            baton-win32-x64
            baton
          )
          mkdir -p npm-tarballs
          pack_destination="${PWD}/npm-tarballs"
          for package_dir in "${package_dirs[@]}"; do
            (
              cd "npm-packages/${package_dir}"
              npm pack --ignore-scripts --pack-destination "${pack_destination}" >/dev/null
            )
          done

          bash scripts/release.sh verify-npm-packages "${version}" npm-packages
          bash scripts/release.sh npm-checksums npm-tarballs npm-SHA256SUMS
          npm_tarballs=(
            "shukelabs-baton-linux-x64-${version}.tgz"
            "shukelabs-baton-linux-arm64-${version}.tgz"
            "shukelabs-baton-darwin-x64-${version}.tgz"
            "shukelabs-baton-darwin-arm64-${version}.tgz"
            "shukelabs-baton-win32-x64-${version}.tgz"
            "shukelabs-baton-${version}.tgz"
          )
          test "$(find npm-tarballs -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq "${#npm_tarballs[@]}"
          for tarball in "${npm_tarballs[@]}"; do
            test -f "npm-tarballs/${tarball}"
          done
          (
            cd npm-tarballs
            sha256sum --check ../npm-SHA256SUMS
          )

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          npm_tarballs=(
            "shukelabs-baton-linux-x64-${version}.tgz"
            "shukelabs-baton-linux-arm64-${version}.tgz"
            "shukelabs-baton-darwin-x64-${version}.tgz"
            "shukelabs-baton-darwin-arm64-${version}.tgz"
            "shukelabs-baton-win32-x64-${version}.tgz"
            "shukelabs-baton-${version}.tgz"
          )
          test -n "${NODE_AUTH_TOKEN:-}" || {
            echo '::error::NPM_TOKEN release secret is required to publish npm packages'
            exit 1
          }

          # npm has no multi-package transaction. All six packages and their
          # checksums are preflighted before this loop; publish the root last
          # so an early failure never exposes an installable root without its
          # native platform packages. A failure reports exactly what was
          # published so the release can be repaired without guessing.
          published=()
          for tarball in "${npm_tarballs[@]}"; do
            if npm publish --access public --ignore-scripts "./npm-tarballs/${tarball}"; then
              published+=("${tarball}")
            else
              echo "::error::npm publish failed after ${#published[@]} of ${#npm_tarballs[@]} packages"
              printf 'published before failure: %s\n' "${published[*]:-none}"
              exit 1
            fi
          done

      - name: Stage and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "baton-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "baton-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "baton-${version}-x86_64-apple-darwin.tar.gz"
            "baton-${version}-aarch64-apple-darwin.tar.gz"
            "baton-${version}-x86_64-pc-windows-msvc.zip"
          )
          upload_paths=(SHA256SUMS npm-SHA256SUMS)
          for asset in "${assets[@]}"; do
            upload_paths+=("dist/${asset}")
          done

          # Keep the release draft until every asset upload succeeds; a failed
          # upload therefore cannot expose an incomplete release to consumers.
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Baton ${RELEASE_TAG}" \
            --notes-file release-notes/release-notes.md \
            "${upload_paths[@]}"
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
