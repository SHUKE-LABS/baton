name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate macOS LaunchAgent
        if: matrix.os == 'macos-latest'
        run: plutil -lint packaging/launchd/baton.plist

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Probe Windows Job Object semantics
        if: matrix.os == 'windows-latest'
        run: cargo test --test windows_job_probe -- --nocapture

      - name: Test
        run: cargo test --verbose

      - name: Release helper tests
        shell: bash
        run: bash tests/release_test.sh

      - name: Verify release docs
        shell: bash
        run: bash scripts/release.sh verify-docs

  # Verifies the opt-in `local` feature (the in-process provider path kept as
  # an escape hatch) still builds and tests cleanly on its own — the default
  # matrix above never enables it, so nothing else would catch a regression.
  local-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --features local -- -D warnings

      - name: Build
        run: cargo build --verbose --features local

      - name: Test
        run: cargo test --verbose --features local

  # Verifies the harness-only default build still cross-compiles for a
  # constrained ARM target now that the provider HTTP client is gated behind
  # `local` — a regression here would mean the slim build no longer serves
  # its intended embedded/router-class deployments.
  cross-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (armv7-unknown-linux-musleabihf)
        run: cross build --verbose --target armv7-unknown-linux-musleabihf

  # Verifies the declared MSRV floor so `cargo install --tag <tag> --locked`
  # can't silently break for a consumer on the exact rustc the README promises.
  # Build/test only — no fmt/clippy (their output is toolchain-version-specific).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install rust toolchain
        # Exact pin tracks Cargo.toml `rust-version`; update both together (#96 AC 4).
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Build (locked)
        run: cargo build --locked --verbose

      - name: Test (locked)
        run: cargo test --locked --verbose
